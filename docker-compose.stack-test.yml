# Local stack smoke test: postgres + backend + frontend on one Compose network.
# Usage (from Triven_backend/):
#   docker compose -f docker-compose.stack-test.yml up -d --build
#   docker compose -f docker-compose.stack-test.yml ps
#   docker compose -f docker-compose.stack-test.yml down -v
name: cineflow-stack-test

services:
  riven_postgres:
    image: postgres:17-alpine
    container_name: cineflow-test-db
    hostname: riven-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: riven
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - cineflow_test_pg:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - riven-db
          - riven_postgres
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d postgres >/dev/null 2>&1 || exit 1; err=$$(psql -U postgres -d postgres -c 'SELECT 1' 2>&1) && exit 0; echo \"$$err\" | grep -Eiq 'recovery mode|starting up|the database system is' && exit 0; exit 1",
        ]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 30s

  riven:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cineflow-test-backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PUID=0
      - PGID=0
      - TZ=UTC
      - CINEFLOW_FORCE_ENV=true
      - CINEFLOW_DATABASE_HOST=postgresql+psycopg2://postgres:postgres@riven_postgres/riven
      - RIVEN_API_KEY=local-legacy-api-key-32characters
      - API_KEY=local-legacy-api-key-32characters
      - BFF_API_KEY=local-bff-api-key-32characters
      - ACTOR_CONTEXT_SECRET=local-stack-test-actor-secret-32chars
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse:/dev/fuse
    volumes:
      - cineflow_test_data:/riven/data
    depends_on:
      riven_postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/docs >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  riven-frontend:
    build:
      context: ../Triven_frontend
      dockerfile: Dockerfile
    container_name: cineflow-test-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://riven:8080
      - BFF_API_KEY=local-bff-api-key-32characters
      - ACTOR_CONTEXT_SECRET=local-stack-test-actor-secret-32chars
      - AUTH_SECRET=local-stack-test-auth-secret-32chars
      - ORIGIN=http://localhost:3000
      - CINEFLOW_DATABASE_URL=/riven/data/cineflow.db
    volumes:
      - cineflow_test_frontend:/riven/data
    depends_on:
      riven:
        condition: service_healthy

  zilean_postgres:
    image: postgres:16-alpine
    container_name: cineflow-test-zilean-db
    hostname: zilean_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zilean
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - cineflow_test_zilean_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 15s

  zilean:
    image: ipromknight/zilean:latest
    container_name: cineflow-test-zilean
    hostname: zilean
    restart: unless-stopped
    ports:
      - "8181:8181"
    environment:
      Zilean__Database__ConnectionString: Host=zilean_postgres;Port=5432;Database=zilean;Username=postgres;Password=postgres
    volumes:
      - cineflow_test_zilean_data:/app/data
    depends_on:
      zilean_postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --connect-timeout 10 --silent --show-error --fail http://127.0.0.1:8181/healthchecks/ping >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: cineflow-test-prowlarr
    hostname: prowlarr
    restart: unless-stopped
    environment:
      - PUID=0
      - PGID=0
      - TZ=UTC
    ports:
      - "9696:9696"
    volumes:
      - ../container_data/prowlarr:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9696/ping >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  cineflow_test_pg:
  cineflow_test_data:
  cineflow_test_frontend:
  cineflow_test_zilean_pg:
  cineflow_test_zilean_data:
