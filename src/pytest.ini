[pytest]
minversion = 7.0
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
addopts = -vv
asyncio_mode = strict
pythonpath = .
testpaths = tests
markers =
    fuse: Linux pyfuse3 integration tests
    integration: end-to-end integration tests
    db: database tests
