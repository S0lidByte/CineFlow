    #     depends_on:
    #         cineflow:
    #             condition: service_started

    cineflow:
        image: coldspirit/cineflow:latest
        container_name: cineflow
        restart: unless-stopped
        ports:
            # Bind to localhost only so external clients cannot bypass the frontend BFF
            - "127.0.0.1:8080:8080"
        tty: true
        cap_add:
            - SYS_ADMIN
        security_opt:
            - apparmor:unconfined
        # Streaming cache defaults to /dev/shm (RAM). Default tmpfs_cache_max_mb=1024.
        # For a ~10 GiB RAM hot cache (4K remux): set filesystem.tmpfs_cache_max_mb=10240,
        # raise shm_size accordingly, and set mem_limit >= cache + 2–4 GiB headroom, e.g.:
        #   shm_size: 12g
        #   mem_limit: 16g
        # Prefer disk cache_dir (warm) + optional cache_hot_dir on tmpfs for two-tier.
        shm_size: 1024m
        devices:
            - /dev/fuse
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=America/New_York
            - RIVEN_FORCE_ENV=true
            # CineFlow names are primary; legacy Riven DNS aliases remain available for existing deployments.
            - CINEFLOW_FORCE_ENV=true
            - CINEFLOW_DATABASE_HOST=postgresql+psycopg2://postgres:postgres@cineflow_postgres/cineflow
            # Optional: move cache off RAM — e.g. CINEFLOW_FILESYSTEM_CACHE_DIR=/riven/data/cache
        healthcheck:
            test: curl -s http://localhost:8080 >/dev/null || exit 1
            interval: 30s
            timeout: 10s
            retries: 10
        volumes:
            - /path/to/cineflow/data:/riven/data
            - /path/to/cineflow/mount:/mount:rshared,z
        depends_on:
            cineflow_postgres:
                condition: service_healthy

    cineflow_postgres:
        image: postgres:17-alpine
        container_name: cineflow-db
        hostname: cineflow-db
        environment:
            - PGDATA=/var/lib/postgresql/data/pgdata
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=cineflow
        volumes:
            - /path/to/cineflow/db:/var/lib/postgresql/data/pgdata
        networks:
            default:
                aliases:
                    # Legacy aliases preserve existing internal clients and custom Compose overrides.
                    - cineflow-db
                    - cineflow_postgres
                    - riven-db
                    - riven_postgres
        healthcheck:
            # Prefer pg_isready for boot/recovery; SELECT 1 when accepting queries.
            # Any recovery/starting FATAL still counts as "starting" (not unhealthy).
            # NOTE: this lives in compose on the host — docker compose pull does NOT update it.
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U postgres -d postgres >/dev/null 2>&1 || exit 1; err=$$(psql -U postgres -d postgres -c 'SELECT 1' 2>&1) && exit 0; echo \"$$err\" | grep -Eiq 'recovery mode|starting up|the database system is' && exit 0; exit 1",
                ]
            interval: 5s
            timeout: 5s
            retries: 60
            start_period: 180s

    jellyfin:
        image: jellyfin/jellyfin
        container_name: jellyfin
        user: 1000:1000
        restart: unless-stopped
        ports:
        - "8096:8096"
        volumes:
        - /path/to/jellyfin/config:/config
        - /path/to/riven/mount:/mount:rslave,z
