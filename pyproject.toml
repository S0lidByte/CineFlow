[project]
name = "riven"
version = "1.28.11"
description = "Plex torrent streaming through Real Debrid and 3rd party services like Overseerr, Mdblist, etc."
authors = [{ name = "Riven Developers" }]
requires-python = "==3.13.*"
readme = "README.md"
license = "GPL-3.0"
dependencies = [
    "dill>=0.3.8,<0.5",
    "requests[socks]>=2.32.5,<3",
    "lxml>=5.1.0,<7",
    "pydantic>=2.12.0,<3",
    "fastapi>=0.140.0,<1",
    "uvicorn[standard]>=0.30.6,<1",
    "apscheduler>=3.10.4,<4",
    "coverage>=7.15.2,<8",
    "cachetools>=5.3.3,<8",
    "loguru>=0.7.2,<0.8",
    "opentelemetry-api>=1.25.0,<2",
    "opentelemetry-sdk>=1.25.0,<2",
    "opentelemetry-exporter-prometheus>=0.46b0,<0.66",
    "prometheus-client>=0.20.0,<0.26",
    "sqlalchemy>=2.0.31,<3",
    "sqla-wrapper>=6.0.0,<7",
    "alembic>=1.13.2,<2",
    "psycopg2-binary>=2.9.9,<3",
    "apprise>=1.12.0,<2",
    "subliminal>=2.2.1,<3",
    "jsonschema>=4.23.0,<5",
    "scalar-fastapi>=1.0.3,<2",
    "psutil>=7.1.0,<8",
    "python-dotenv>=1.0.1,<2",
    "requests-ratelimiter>=0.7.0,<0.11",
    "requests-cache>=1.2.1,<2",
    "kink>=0.8.1,<0.10",
    "bencodepy>=0.9.5,<0.10",
    "plexapi>=4.17.1,<5",
    "pyfuse3>=3.4.0,<4; sys_platform == 'linux'",
    "babel>=2.18.0,<3",
    "httpx[http2,socks]>=0.28.1,<0.29",
    "starlette>=1.3.1,<2",
    "rank-torrent-name>=1.11.1,<2",
    "parsett>=1.8.2,<2",
    "trio-util>=0.8.0",
    "ordered-set>=4.1.0",
    "lazy-imports>=1.1.0",
    "python-multipart>=0.0.31",
]


[dependency-groups]
dev = [
    "pyright>=1.1.352,<2",
    "pyperf>=2.2.0,<3",
    "pytest>=9.0.3,<10",
    "pytest-mock>=3.14.0,<4",
    "responses==0.26.2",
    "pyfakefs>=5.4.1,<7",
    "ruff>=0.16.0,<0.17",
    "isort>=5.10.1,<9",
    "codecov>=2.1.13,<3",
    "testcontainers>=4.8.0,<5",
    "mypy>=2.3.0,<3",
    "requests-mock>=1.12.1,<2",
    "black>=25.9.0,<27",
    "pre-commit>=4.3.0,<5",
    "openapi-generator-cli[jdk4py]>=7.17.0",
    "types-lxml>=2025.8.25",
]
test = ["pytest>=9.0.3,<10"]

[tool.pyright]
reportMissingImports = "none"


[tool.uv]
package = false
default-groups = [
    "dev",
    "test",
]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'win32'"
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.isort]
profile = "black"

[tool.black]
line-length = 88
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
exclude = ["src/schemas/**"]
ignore = [
  "PLR0913", # flask8-bugbear: Too many arguments for a method or function
  "PLR0911", # flask8-bugbear: Too many return statements
  "PLR2004", # flake8-bugbear: Magic value used in comparison
  "S104",    # flake8-bandit: Possible binding to all interfaces
  "S108",    # flake8-bandit: Probable insecure usage of temp file/directory
  "S311",    # flake8-bandit: Standard pseudo-random generators are not suitable for security/cryptographic purposes
  "S101",    # ruff: Ignore assert warnings on tests
  "RET505",  #
  "RET503",  # ruff: Ignore required explicit returns (is this desired?)
  "SLF001",  # private member accessing from pickle
  "B904",    # ruff: ignore raising exceptions from except for the API
  "PLC0415", # ruff: allow local imports for circular dependencies
  "ARG002", # ruff: allow unused arguments (common in overrides/tests)
  "F841",   # ruff: allow unused variables
  "PLW0603", # ruff: allow global statement
  "F401",   # ruff: allow unused imports (often used for registration)
  "C901",   # ruff: allow complex functions
  "PLR0912", # ruff: allow too many branches
  "PLR0915", # ruff: allow too many statements
  "B008",   # FastAPI: function calls in argument defaults are the intended DI pattern
  "S110",   # intentional silent except-pass in circuit-breaker and cleanup paths
  "S112",   # intentional silent except-continue in resilient loops
  "S324",   # sha1 used for non-security purposes (cache keys)
  "S603",   # subprocess used with trusted internal input
  "S607",   # partial executable path used intentionally (e.g. ffprobe)
  "S608",   # SQL construction unavoidable in migration utility
  "T201",   # print used intentionally in websocket debug paths
  "E402",   # load_dotenv() must precede other imports in main.py
  "S102",   # exec used intentionally in main.py runtime bootstrap
  # Pre-existing style debt — enable the ruff CI gate without a mass rewrite.
  "PLW0108", # unnecessary-lambda (settings defaults / DI factories)
  "SIM105",  # suppressible-exception (cleanup paths)
  "SIM102",  # collapsible-if
  "SIM117",  # multiple-with-statements
  "RET504",  # unnecessary-assign
  "PLW2901", # redefined-loop-name
  "PLW0406", # import-self (sqla_wrapper db package pattern)
  "SIM103",  # needless-bool
  "SIM108",  # if-else-block-instead-of-if-exp
  "PLC0105", # TypeVar covariance naming
  "ARG001",  # unused function args in callbacks / API shims
  "ARG005",  # unused lambda args in done callbacks
  "B023",    # loop variable binding in nested callbacks (intentional capture)
  "B005",    # strip multi-char (legacy imdb id cleanup)
  "E712",    # SQLAlchemy == False comparisons
  "E721",    # type(...) == type(...) in MediaItem.__eq__
  "E741",    # ambiguous name from AllDebrid API field `l`
  "PLE1310", # lstrip duplicate chars (legacy)
  "SIM118",  # .keys() iteration (pydantic root models)
  # Ruff 0.16+ rule surface — defer mass cleanup (same policy as style-debt ignores).
  "BLE001",  # blind-except
  "DTZ001", "DTZ005", "DTZ006", "DTZ007",  # naive datetime
  "RUF009", "RUF010", "RUF012", "RUF046", "RUF059",  # ruff extras
  "UP007", "UP017", "UP022", "UP031", "UP035", "UP037", "UP040", "UP043", "UP046",  # pyupgrade
  "TRY002", "TRY004", "TRY203",  # tryceratops
  "C408",  # unnecessary-collection-call
  "SIM401",  # if-else-block-instead-of-dict-get
  "PYI036", "FURB162", "ASYNC230", "PERF102",
  "PLR0917",  # too many positional args (FastAPI/handlers)
  "PIE807",  # prefer list over lambda — conflicts with pyright on Field(default_factory)
]


extend-select = [
  "I",   # isort
  "C90", # mccabe complexity
  "B",   # flake8-bugbear
  "PL",  # pycodestyle
  "S",   # flake8-bandit
  "T10", # flake8-debugger
  "PIE", # flake8-pie
  "T20", # flake8-print
  "Q",   # flake8-quotes
  "RSE", # flake8-raise
  "RET", # flake8-return
  "SLF", # flake8-self
  "SIM", # flake8-simplify
  "ARG", # flake8-unused-arguments
]

[tool.ruff.lint.per-file-ignores]
"src/tests/**" = ["S105", "S106"]
"src/routers/secure/webhooks.py" = ["S105"]  # header name constant, not a password
